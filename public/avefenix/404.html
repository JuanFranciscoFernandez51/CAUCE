<!DOCTYPE html>
<html lang="es" class="scroll-smooth overscroll-x-none">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página no encontrada - AVE FÉNIX LEDS</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: "#0dccf2",
                        secondary: "#FF8C42",
                        "background-light": "#f5f8f8",
                        "background-dark": "#050a0b",
                        "surface-dark": "#0c181a",
                    },
                    fontFamily: {
                        display: ["Space Grotesk", "sans-serif"],
                        body: ["Noto Sans", "sans-serif"],
                    },
                    animation: {
                        'grid-movement': 'grid-movement 20s linear infinite',
                        'glow-pulse': 'glow-pulse 4s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        'grid-movement': {
                            '0%': { transform: 'translateY(0)' },
                            '100%': { transform: 'translateY(50px)' },
                        },
                        'glow-pulse': {
                            '0%': { opacity: 0.3, transform: 'scale(0.95)' },
                            '100%': { opacity: 0.7, transform: 'scale(1.05)' },
                        }
                    }
                },
            },
        }
    </script>
    <style>
        .grid-bg {
            background-size: 50px 50px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            mask-image: radial-gradient(circle at center, black 10%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 10%, transparent 80%);
        }
        .glow-orb-primary {
            background: radial-gradient(circle at center, rgba(13, 204, 242, 0.15) 0%, transparent 70%);
        }
        .glow-orb-secondary {
            background: radial-gradient(circle at center, rgba(255, 140, 66, 0.15) 0%, transparent 70%);
        }
    </style>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body
    class="custom-scrollbar bg-background-dark text-slate-100 font-display selection:bg-primary selection:text-background-dark overscroll-none min-h-screen flex flex-col items-center justify-center relative overflow-hidden">

    <!-- Optimized Background Efects (No Blur) -->
    <div class="absolute inset-0 w-full h-full z-0 pointer-events-none opacity-80">
        <!-- Moving Grid -->
        <div class="absolute inset-0 -top-[50px] grid-bg animate-grid-movement"></div>
        
        <!-- Animated Glow Orbs (Radial Graidents instead of blur) -->
        <div class="absolute top-0 right-[-10vw] w-[60vw] h-[60vw] max-w-[800px] max-h-[800px] glow-orb-primary rounded-full animate-glow-pulse"></div>
        <div class="absolute bottom-[-10vh] left-[-10vw] w-[50vw] h-[50vw] max-w-[700px] max-h-[700px] glow-orb-secondary rounded-full animate-glow-pulse" style="animation-duration: 6s; animation-delay: -2s;"></div>
    </div>

    <!-- Content -->
    <div class="z-10 text-center px-6 max-w-3xl flex flex-col items-center mt-[-5%]">
        <!-- Logo -->
        <a href="index.html" class="mb-12 inline-block hover:scale-105 transition-transform duration-300">
            <img src="logo.png" alt="Ave Fénix LED" class="h-16 w-auto drop-shadow-[0_0_15px_rgba(255,255,255,0.1)]">
        </a>

        <!-- 404 Graphic -->
        <div class="relative mb-6">
            <h1
                class="text-8xl md:text-[12rem] font-black text-transparent bg-clip-text bg-gradient-to-br from-primary via-white to-secondary leading-none drop-shadow-2xl">
                404
            </h1>
            <div class="absolute -inset-4 bg-primary/20 blur-[80px] -z-10 rounded-full"></div>
        </div>

        <!-- Message -->
        <h2 class="text-3xl md:text-5xl font-black text-white mb-6 tracking-tight drop-shadow-md">
            Oops! <br class="md:hidden"> La página que buscas no existe.
        </h2>

        <p class="text-lg md:text-xl text-slate-400 font-light font-body mb-12 max-w-lg mx-auto">
            Es posible que el enlace sea incorrecto o que la página haya sido eliminada.
        </p>

        <!-- Button -->
        <a href="index.html"
            class="group px-10 py-4 md:py-5 rounded-full bg-primary text-background-dark font-black text-lg hover:-translate-y-1 hover:scale-105 transition-all duration-300 shadow-[0_0_30px_rgba(13,204,242,0.3)] hover:shadow-[0_0_50px_rgba(13,204,242,0.5)] text-center uppercase tracking-widest flex items-center gap-3">
            <svg class="w-6 h-6 group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor"
                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <path d="M19 12H5" />
                <path d="m12 19-7-7 7-7" />
            </svg>
            Volver al inicio
        </a>
    </div>
</body>

</html>
